<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none" role="img" aria-labelledby="title desc"><title id="title">lynn — AI, vision and creative engineering</title><desc id="desc">Translucent cyan and violet ribbons with light flowing along their edges. A calm dark canvas, bold typography and no rotating objects. Motion pauses when reduced motion is preferred.</desc><defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#090c17"/><stop offset=".54" stop-color="#0d1223"/><stop offset="1" stop-color="#12152b"/></linearGradient>
    <radialGradient id="ambient"><stop stop-color="#5160b8" stop-opacity=".24"/><stop offset="1" stop-color="#20254f" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1e3a52"/><stop offset=".23" stop-color="#4c85a4" stop-opacity=".65"/><stop offset=".47" stop-color="#292d5b"/><stop offset=".68" stop-color="#7b68b5" stop-opacity=".8"/><stop offset="1" stop-color="#aec9e6" stop-opacity=".4"/></linearGradient>
    <linearGradient id="foldShading" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#060b18" stop-opacity=".4"/><stop offset=".27" stop-color="#73e9ef" stop-opacity=".25"/><stop offset=".46" stop-color="#0c1028" stop-opacity=".6"/><stop offset=".67" stop-color="#be9bff" stop-opacity=".12"/><stop offset="1" stop-color="#7bdff5" stop-opacity=".2"/></linearGradient>
    <linearGradient id="backGlass"><stop stop-color="#7b9aae" stop-opacity=".04"/><stop offset=".6" stop-color="#41628d" stop-opacity=".28"/><stop offset="1" stop-color="#859bd3" stop-opacity=".15"/></linearGradient>
    <linearGradient id="lowerGlass"><stop stop-color="#142b53" stop-opacity=".1"/><stop offset=".5" stop-color="#3b2863" stop-opacity=".7"/><stop offset="1" stop-color="#565098" stop-opacity=".15"/></linearGradient>
    <linearGradient id="rim"><stop stop-color="#79e7ef" stop-opacity=".2"/><stop offset=".27" stop-color="#bdfaff"/><stop offset=".55" stop-color="#aca0f2"/><stop offset="1" stop-color="#e6e1ff"/></linearGradient>
    <linearGradient id="rimBottom"><stop stop-color="#7ec8f5" stop-opacity=".6"/><stop offset=".5" stop-color="#9b8add"/><stop offset="1" stop-color="#81c8eb" stop-opacity=".15"/></linearGradient>
    <linearGradient id="sheen"><stop stop-color="#dcfaff" stop-opacity="0"/><stop offset=".5" stop-color="#dcfaff" stop-opacity=".22"/><stop offset="1" stop-color="#dcfaff" stop-opacity="0"/></linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#b7c3df" opacity=".1"/></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="entranceFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="95" y2="0"><stop stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="entrance" maskUnits="userSpaceOnUse" x="-20" y="-200" width="800" height="900"><rect x="-20" y="-200" width="800" height="900" fill="url(#entranceFade)"/></mask>
    <clipPath id="canvas"><rect width="640" height="640" rx="18"/></clipPath>
    <clipPath id="ribbonClip"><path d="M8 361 C143 356 102 123 281 145 C438 164 412 23 615 2 L615 82 C471 104 471 238 305 225 C164 214 172 432 8 439 Z"/></clipPath>
  </defs><style>
    .light-trail { stroke-dasharray: 110 960; animation: travel 5s linear infinite; }
    .second { stroke-dasharray: 65 1005; animation-duration: 7s; animation-delay: -3s; opacity: .75; }
    .sheen { animation: sweep 9s ease-in-out infinite; }
    .spark { animation: drift 7s ease-in-out infinite alternate; }
    @keyframes travel { from { stroke-dashoffset: 1070; } to { stroke-dashoffset: 0; } }
    @keyframes sweep { 0%,8% { transform: translateX(-180px); opacity: 0; } 24% { opacity: 1; } 70%,100% { transform: translateX(770px); opacity: 0; } }
    @keyframes drift { from { transform: translateY(3px); opacity:.2; } to { transform: translateY(-8px); opacity:.65; } }
    @media (prefers-reduced-motion: reduce) { .light-trail,.sheen,.spark { animation: none; } .light-trail { stroke-dasharray: none; opacity: .35; } .sheen { opacity: 0; } }
  </style><g clip-path="url(#canvas)"><rect width="640" height="640" fill="url(#background)"/><ellipse cx="440" cy="420" rx="410" ry="300" fill="url(#ambient)"/><rect width="640" height="640" fill="url(#grain)"/><g transform="translate(65 265) scale(.96 .65)"><g class="ribbons" mask="url(#entrance)">
    <g transform="translate(2 -99)" opacity=".48">
      <path d="M8 361 C143 356 102 123 281 145 C438 164 412 23 615 2 L615 82 C471 104 471 238 305 225 C164 214 172 432 8 439 Z" fill="url(#backGlass)" stroke="#7f9bc8" stroke-opacity=".22"/>
      <path d="M8 439 C172 432 164 214 305 225 C471 238 471 104 615 82" stroke="#9eb4dc" stroke-opacity=".32" stroke-width="1.1"/>
    </g>
    <g transform="translate(38 84)" opacity=".65">
      <path d="M8 361 C143 356 102 123 281 145 C438 164 412 23 615 2 L615 82 C471 104 471 238 305 225 C164 214 172 432 8 439 Z" fill="url(#lowerGlass)" stroke="#7a6bef" stroke-opacity=".38"/>
      <path d="M8 361 C143 356 102 123 281 145 C438 164 412 23 615 2" stroke="#8b88ff" stroke-opacity=".65" stroke-width="1.2"/>
    </g>
    <path d="M8 361 C143 356 102 123 281 145 C438 164 412 23 615 2 L615 82 C471 104 471 238 305 225 C164 214 172 432 8 439 Z" fill="url(#glass)"/>
    <path d="M8 361 C143 356 102 123 281 145 C438 164 412 23 615 2 L615 82 C471 104 471 238 305 225 C164 214 172 432 8 439 Z" fill="url(#foldShading)"/>
    <path d="M8 368.8 C145.9 363.6 108.2 132.1 283.4 153 C441.3 171.4 417.9 31.1 615 10" stroke="#c7baff" stroke-opacity=".055" stroke-width=".8" fill="none"/><path d="M8 376.6 C148.8 371.2 114.4 141.2 285.8 161 C444.6 178.8 423.8 39.2 615 18" stroke="#c7baff" stroke-opacity=".055" stroke-width=".8" fill="none"/><path d="M8 384.4 C151.7 378.8 120.6 150.3 288.2 169 C447.9 186.2 429.7 47.3 615 26" stroke="#c7baff" stroke-opacity=".14" stroke-width=".8" fill="none"/><path d="M8 392.2 C154.6 386.4 126.8 159.4 290.6 177 C451.2 193.6 435.6 55.4 615 34" stroke="#c7baff" stroke-opacity=".055" stroke-width=".8" fill="none"/><path d="M8 400 C157.5 394 133 168.5 293 185 C454.5 201 441.5 63.5 615 42" stroke="#c7baff" stroke-opacity=".055" stroke-width=".8" fill="none"/><path d="M8 407.8 C160.4 401.6 139.2 177.6 295.4 193 C457.8 208.4 447.4 71.6 615 50" stroke="#c7baff" stroke-opacity=".14" stroke-width=".8" fill="none"/><path d="M8 415.6 C163.3 409.2 145.4 186.7 297.8 201 C461.1 215.8 453.3 79.69999999999999 615 58" stroke="#c7baff" stroke-opacity=".055" stroke-width=".8" fill="none"/><path d="M8 423.4 C166.2 416.8 151.6 195.8 300.2 209 C464.4 223.2 459.2 87.8 615 66" stroke="#c7baff" stroke-opacity=".055" stroke-width=".8" fill="none"/><path d="M8 431.2 C169.1 424.4 157.8 204.9 302.6 217 C467.7 230.60000000000002 465.1 95.9 615 74" stroke="#c7baff" stroke-opacity=".14" stroke-width=".8" fill="none"/>
    <g clip-path="url(#ribbonClip)"><path class="sheen" d="M-130 -100H-40L270 600H180Z" fill="url(#sheen)"/></g>
    <path d="M8 361 C143 356 102 123 281 145 C438 164 412 23 615 2" stroke="url(#rim)" stroke-width="2"/>
    <path d="M8 439 C172 432 164 214 305 225 C471 238 471 104 615 82" stroke="url(#rimBottom)" stroke-width="1.2"/>
    <path d="M8 361 C143 356 102 123 281 145 C438 164 412 23 615 2" stroke="#a3f7ff" stroke-width="8" class="light-trail" filter="url(#softGlow)" opacity=".8"/>
    <path d="M8 361 C143 356 102 123 281 145 C438 164 412 23 615 2" stroke="#ecffff" stroke-width="2.6" class="light-trail"/>
    <path d="M8 439 C172 432 164 214 305 225 C471 238 471 104 615 82" stroke="#cfc7ff" stroke-width="1.8" class="light-trail second"/>
    <path d="M12 361L12 439 M614 2V82" stroke="#b9caff" stroke-opacity=".3"/>
  </g></g><path class="spark" style="animation-delay:-0s" d="M95 410H101M98 407V413" stroke="#a8c9f4" stroke-width="1"/><path class="spark" style="animation-delay:-2s" d="M527 320H533M530 317V323" stroke="#a8c9f4" stroke-width="1"/><path class="spark" style="animation-delay:-4s" d="M571 492H577M574 489V495" stroke="#a8c9f4" stroke-width="1"/><path d="M36 42H53" stroke="#79e7ef" stroke-width="2"/><text x="66" y="46" font-size="14" fill="#8c95af" font-family="Consolas, Monaco, monospace" letter-spacing="2" >UTENKKEKOU / DIGITAL LAB</text><text x="32" y="208" font-family="Arial, Helvetica, sans-serif" font-size="150" fill="#f3f5ff" font-weight="700" letter-spacing="-10">lynn</text><rect x="309" y="187" width="16" height="16" rx="2" fill="#a99cff"/><text x="38" y="270" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#b8c7e1" >AI. Vision. Creative engineering.</text><text x="38" y="302" font-size="11" fill="#7e8da8" font-family="Consolas, Monaco, monospace" letter-spacing="2" >IDEAS INTO EXPERIENCES</text><path d="M36 576H604" stroke="#353b56" stroke-opacity=".65"/><text x="38" y="610" font-size="13" fill="#c9d4e8" font-family="Consolas, Monaco, monospace" letter-spacing="2" >AI SYSTEMS</text><text x="246" y="610" font-size="13" fill="#c9d4e8" font-family="Consolas, Monaco, monospace" letter-spacing="2" >WEB</text><text x="376" y="610" font-size="13" fill="#c9d4e8" font-family="Consolas, Monaco, monospace" letter-spacing="2" >MOBILE</text><path d="M572 603H596M590 597L596 603L590 609" stroke="#9eabda" stroke-width="1.2"/><rect x=".5" y=".5" width="639" height="639" rx="17.5" stroke="#4d5776" stroke-opacity=".3"/></g></svg>
